    function App() {
      const [activeTab, setActiveTab] = useState("reply");

      const [customApiKey, setCustomApiKey] = useState(() => {

      });

      const [topicLoading, setTopicLoading] = useState(false);

      // Saved Favorites
      const [savedLines, setSavedLines] = useState(() => {
        try {
          const stored = localStorage.getItem("rizz_tenglish_saved");
          return stored ? JSON.parse(stored) : [];
        } catch {
          return [];
        }
      });

      useEffect(() => {
        try { localStorage.setItem("rizz_tenglish_saved", JSON.stringify(savedLines)); } catch {}
      }, [savedLines]);

      useEffect(() => {
        try { localStorage.setItem("rizz_gemini_api_key", customApiKey.trim()); } catch {}
      }, [customApiKey]);

      const triggerToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(""), 2600);
      };

      const callGemini = async (promptText) => {
        const apiKey = customApiKey.trim();
        if (!apiKey) {
          throw new Error("Tap 'Add API Key' at the top right and paste your free Gemini API key first.");
        }

        // Current active Gemini 3.x models (2.5 models are restricted for new keys)
        const modelsToTry = [
          "gemini-3.5-flash-lite",
          "gemini-3.8-flash",
          "gemini-3.6-flash"
        ];

        const payload = {
          contents: [{ parts: [{ text: promptText }] }],
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: {
              type: "OBJECT",
              properties: {
                suggestions: {
                  type: "ARRAY",
                  items: {
                    type: "OBJECT",
                    properties: {
                      reply: { type: "STRING" },
                      translation: { type: "STRING" },
                      whyItWorks: { type: "STRING" },
                      tone: { type: "STRING" }
                    },
                    required: ["reply", "translation", "whyItWorks", "tone"]
                  }
                }
              },
              required: ["suggestions"]
            }
          }
        };

        let lastError = "Could not reach Gemini servers.";

        for (const modelName of modelsToTry) {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(apiKey)}`;
          try {
            const response = await fetch(url, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "x-goog-api-key": apiKey
              },
              body: JSON.stringify(payload)
            });

            if (response.ok) {
              const data = await response.json();
              const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
              if (rawText) {
                const parsed = JSON.parse(rawText);
                if (parsed.suggestions && parsed.suggestions.length > 0) {
                  return parsed.suggestions;
                }
              }
            } else {
              let detail = "";
              try {
                const errJson = await response.json();
                detail = errJson?.error?.message ? `: ${errJson.error.message}` : "";
              } catch {}
              lastError = `API Error (${response.status})${detail}`;
              if (response.status === 400 || response.status === 401 || response.status === 403) {
                throw new Error(lastError);
              }
              await new Promise((r) => setTimeout(r, 500));
            }
          } catch (err) {
            if (err.message && (err.message.includes("400") || err.message.includes("401") || err.message.includes("403"))) {
              throw err;
            }
            lastError = err.message || lastError;
          }
        }

        throw new Error(lastError);
      };

      const getLanguageRule = (langId) => {
        if (langId === "telugu_only") {
          return `STRICT LANGUAGE RULE — ONLY TELUGU (TYPED IN ENGLISH LETTERS):
- Write 100% in natural spoken Telugu using English letters (transliteration, e.g., "Nuvvu em chesthunnav? Naku bore kodthundi").
- ZERO English words allowed! Do NOT mix English words like "busy", "free", "movie", "coffee", "weekend", "bored", "cute", "miss", "think", "mood", "plan", "message", "reply" — use pure everyday Telugu words in English script instead (e.g., "pani", "khali", "cinema", "nidra", "alochisthunna", "kaburlu", "kaluddhama").
- Do NOT use Telugu script (తెలుగు), ONLY English letters.`;
        }
        if (langId === "english") {
          return `STRICT LANGUAGE RULE — PURE ENGLISH ONLY:
- Write 100% in natural, modern conversational English.
- ZERO Telugu words allowed (no "em", "nuvvu", "kada", "ra", "le", "mari", etc.).`;
        }
        return `STRICT LANGUAGE RULE — TENGLISH MIX (HYDERABAD / ANDHRA / TELANGANA CASUAL CHAT):
- Mix natural spoken Telugu (in English letters) with casual English words just like young people text on WhatsApp/Instagram (e.g., "Nuvvu free ga unte oka coffee ki veldama?", "Nijam cheppu, nannu miss avthunnav kada?").`;
      };

      const humanStyleRule = `HUMAN TEXTING STYLE RULES (CRITICAL — MUST SOUND 100% HUMAN, NEVER LIKE AI):
- Sound like a real 23-year-old texting on WhatsApp or Instagram, NOT a movie dialogue writer, poet, or AI chatbot.
- Keep messages crisp, natural, and realistic (1 to 2 short sentences max).
- NEVER use cheesy poetic lines, heavy metaphors, Shakespeare/bollywood drama, or overly formal words.
- Use natural lowercase/casual punctuation and at most 0 or 1 subtle emoji.
- Include a natural conversational hook (a light question or teasing statement) so the other person wants to reply and keep chatting long.`;

      const handleGenerateReplies = async (overrideMsg = null, overrideLang = null) => {
        const targetMsg = (overrideMsg !== null ? overrideMsg : incomingMsg).trim();
        const activeLang = overrideLang || language;
        if (!targetMsg) {
          setErrorMsg("Paste or type the message they sent first!");
          return;
        }
        setErrorMsg("");
        setIsLoading(true);
        setGeneratedReplies([]);

        const vibeObj = VIBE_OPTIONS.find((v) => v.id === vibe);
        const prompt = `You are a real human friend helping someone reply to their crush/partner on WhatsApp or Instagram.
Incoming message from them: "${targetMsg}"
Extra context: "${contextNote || "Casual chat"}"
Desired Vibe: ${vibeObj?.label} (${vibeObj?.desc})

${getLanguageRule(activeLang)}

${humanStyleRule}

Generate 3 distinct, natural human reply options.
For each option provide:
- "reply": the exact text message to copy and send
- "translation": clear English meaning (if reply is already Pure English, give a quick note on the subtext/vibe)
- "whyItWorks": 1 short sentence explaining why this keeps the chat going
- "tone": 2-word tag (e.g. "Casual Tease", "Sweet & Real", "Smooth Flirt")`;

        try {
          const results = await callGemini(prompt);
          setGeneratedReplies(results.length ? results : DEFAULT_REPLIES);
        } catch (err) {
          setErrorMsg(err.message || "Could not connect. Check your API key.");
        } finally {
          setIsLoading(false);
        }
      };

      const detectAndGenerateForKeyboard = async (msgText) => {
        setKbLoading(true);
        setKbSuggestions([]);
        const vibeObj = VIBE_OPTIONS.find((v) => v.id === vibe);
        const prompt = `Incoming WhatsApp/Instagram message: "${msgText}"
Vibe: ${vibeObj?.label}.
${getLanguageRule(language)}
${humanStyleRule}
Generate 3 short, ultra-natural human replies that keep the chat going. Provide reply, translation, whyItWorks, and tone.`;

        try {
          const results = await callGemini(prompt);
          setKbSuggestions(results.length ? results : DEFAULT_REPLIES);
        } catch {
          setKbSuggestions(DEFAULT_REPLIES);
        } finally {
          setKbLoading(false);
        }
      };

      const startLongPress = (msg) => {
        if (!keyboardEnabled) {
          triggerToast("Turn ON Rizz Keyboard toggle first!");
          return;
        }
        setPressingId(msg.id);
        pressTimerRef.current = setTimeout(() => {
          setPressingId(null);
          setDetectedBubble(msg);
          triggerToast("Detected message! Generating human replies...");
          detectAndGenerateForKeyboard(msg.text);
        }, 500);
      };

      const cancelLongPress = () => {
        setPressingId(null);
        if (pressTimerRef.current) clearTimeout(pressTimerRef.current);
      };

      const handlePasteFromClipboard = async () => {
        try {
          const text = await navigator.clipboard.readText();
          if (text && text.trim()) {
            setIncomingMsg(text.trim());
            triggerToast("Detected copied message! Generating replies...");
            handleGenerateReplies(text.trim());
          } else {
            triggerToast("Clipboard is empty—copy a chat message first!");
          }
        } catch {
          triggerToast("Tap the text box and paste your copied chat!");
        }
      };

      const handleSendDemoMessage = (textToSend) => {
        const clean = (textToSend || kbDraft).trim();
        if (!clean) return;
        const newMsg = {

                    <button
                      key={cat.id}
                      onClick={() => handleGenerateTopics(cat.id)}
                      className={`p-3 rounded-xl border text-left transition ${
                        selectedTopic === cat.id
                          ? "bg-purple-500/20 border-purple-500 text-white"
                          : "bg-slate-900/70 border-slate-800 text-slate-400 hover:border-slate-700"
                      }`}
                    >
                      <div className="text-xs font-semibold text-slate-100">{cat.title}</div>
                      <div className="text-[10px] text-slate-400 mt-0.5">{cat.desc}</div>
                    </button>
                  ))}
                </div>

                <div className="flex justify-end">
                  <button
                    onClick={() => handleGenerateTopics(selectedTopic)}
                    disabled={topicLoading}
                    className="text-xs font-medium text-purple-300 hover:text-purple-200 flex items-center gap-1.5 bg-purple-500/10 border border-purple-500/30 px-3 py-1.5 rounded-lg"
                  >
                    <Icon name="refresh" className={`w-3.5 h-3.5 ${topicLoading ? "animate-spin" : ""}`} />
                    Fresh Starters
                  </button>
                </div>

                {topicLoading ? (
                  <div className="py-10 text-center text-xs text-slate-400 space-y-2">
                    <Icon name="sparkles" className="w-6 h-6 text-purple-400 mx-auto animate-pulse" />
                    <p>Crafting real human conversation starters...</p>
                  </div>
                ) : (
                  <div className="space-y-3">
                    {topicIdeas.map((item, idx) => (
                      <div
                        key={idx}
                        className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2"
                      >
                        <div className="flex items-center justify-between">
                          <span className="text-[10px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded bg-purple-500/15 text-purple-300 border border-purple-500/30">
                            {item.tone}
                          </span>
                          <div className="flex items-center gap-1.5">
                            <button
                              onClick={() => toggleSaveLine(item)}
                              className={`p-1.5 rounded-lg border ${
                                isSaved(item.reply)
                                  ? "bg-amber-500/20 border-amber-500/40 text-amber-300"
                                  : "bg-slate-800 border-slate-700 text-slate-400"
                              }`}
                            >
                              <Icon name="bookmark" className="w-3.5 h-3.5" />
                            </button>
                            <button
                              onClick={() => copyToClipboard(item.reply, `top-${idx}`)}
                              className="flex items-center gap-1 text-xs font-medium bg-purple-600 hover:bg-purple-500 text-white px-3 py-1 rounded-lg"
                            >
                              {copiedIndex === `top-${idx}` ? "Copied!" : "Copy"}
                            </button>
                          </div>
                        </div>
                        <p className="text-sm font-medium text-white">{item.reply}</p>
                        {item.translation && (
                          <p className="text-xs text-slate-400 italic">Meaning: {item.translation}</p>
                        )}
                        <p className="text-[11px] text-emerald-400/90">{item.whyItWorks}</p>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TAB 4: RIZZ VAULT & SAVED */}
            {activeTab === "vault" && (
              <div className="space-y-5">
                {savedLines.length > 0 && (
                  <div className="space-y-2.5">
                    <h2 className="text-xs font-semibold uppercase tracking-wider text-amber-400 flex items-center gap-1.5">
                      <Icon name="bookmark" className="w-3.5 h-3.5" />
                      Your Saved Favorites ({savedLines.length})
                    </h2>
                    {savedLines.map((item, idx) => (
                      <div
                        key={idx}
                        className="bg-amber-500/5 border border-amber-500/25 rounded-2xl p-3.5 flex items-start justify-between gap-3"
                      >
                        <div className="space-y-1">
                          <p className="text-sm font-medium text-white">{item.reply}</p>
                          {item.translation && (
                            <p className="text-[11px] text-slate-400">{item.translation}</p>
                          )}
                        </div>
                        <div className="flex items-center gap-1 shrink-0">
                          <button
                            onClick={() => copyToClipboard(item.reply, `sav-${idx}`)}
                            className="p-2 rounded-lg bg-slate-800 text-slate-200 hover:bg-rose-500 hover:text-white transition"
                          >
                            <Icon name="copy" className="w-3.5 h-3.5" />
                          </button>
                          <button
                            onClick={() => toggleSaveLine(item)}
                            className="p-2 rounded-lg bg-slate-800 text-rose-400 hover:bg-rose-500/20 transition"
                          >
                            <Icon name="trash" className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {STARTER_PACKS.map((pack, pIdx) => (
                  <div key={pIdx} className="space-y-2.5">
                    <div className="flex items-center justify-between">
                      <h3 className="text-sm font-bold text-white">{pack.category}</h3>
                      <span className="text-[10px] font-medium px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
                        {pack.badge}
                      </span>
                    </div>

                    <div className="space-y-2.5">
                      {pack.lines.map((line, lIdx) => (
                        <div
                          key={lIdx}
                          className="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-2"
                        >
                          <div className="flex items-center justify-between">
                            <span className="text-[10px] font-semibold uppercase text-rose-400">
                              {line.tag}
                            </span>
                            <div className="flex items-center gap-1.5">
                              <button
                                onClick={() =>
                                  toggleSaveLine({
                                    reply: line.text,
                                    translation: line.meaning,
                                    tone: line.tag
                                  })
                                }
                                className={`p-1.5 rounded-lg border ${
                                  isSaved(line.text)
                                    ? "bg-amber-500/20 border-amber-500/40 text-amber-300"
                                    : "bg-slate-800 border-slate-700 text-slate-400"
                                }`}
                              >
                                <Icon name="bookmark" className="w-3.5 h-3.5" />
                              </button>
                              <button
                                onClick={() => copyToClipboard(line.text, `v-${pIdx}-${lIdx}`)}
                                className="flex items-center gap-1 text-xs font-medium bg-slate-800 hover:bg-rose-500 text-slate-200 hover:text-white px-2.5 py-1 rounded-lg transition"
                              >
                                {copiedIndex === `v-${pIdx}-${lIdx}` ? "Copied" : "Copy"}
                              </button>
                            </div>
                          </div>
                          <p className="text-sm text-white font-medium leading-snug">{line.text}</p>
                          <p className="text-[11px] text-slate-400">{line.meaning}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* TAB 5: PRO DATING & CHATTING TIPS */}
            {activeTab === "tips" && (
              <div className="space-y-3.5">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2">
                  <span className="text-[10px] font-bold uppercase tracking-wider text-rose-400">Rule #1</span>
                  <h3 className="text-sm font-bold text-white">Stop Asking Boring Interview Questions</h3>
                  <p className="text-xs text-slate-300 leading-relaxed">
                    Avoid repeating "Tinava?", "Em chesthunnav?", "Work ela undi?". Instead, make playful assumptions: <span className="text-rose-300">"Nuvvu pakka ippudu series chusthu time pass chesthunnav kada?"</span>
                  </p>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2">
                  <span className="text-[10px] font-bold uppercase tracking-wider text-purple-400">Rule #2</span>
                  <h3 className="text-sm font-bold text-white">The Push-Pull Tease</h3>
                  <p className="text-xs text-slate-300 leading-relaxed">
                    Give a sweet compliment and immediately add a light tease so you don't sound overly desperate: <span className="text-purple-300">"Nuvvu chala manchi danivi anukunna... kani koncham over action ekkuva neeku!"</span>
                  </p>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2">
                  <span className="text-[10px] font-bold uppercase tracking-wider text-amber-400">Rule #3</span>
                  <h3 className="text-sm font-bold text-white">Match Their Energy & Move Off Text</h3>
                  <p className="text-xs text-slate-300 leading-relaxed">
                    Keep your texts roughly the same length as theirs. Once the vibe is flowing well for 2–3 days, suggest a quick coffee or hangout instead of endless texting.
                  </p>
                </div>
              </div>
            )}
          </main>

          {/* Bottom Navigation Bar */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-950/95 backdrop-blur-lg border-t border-slate-800/90 px-1.5 py-2 flex items-center justify-around z-30">
            {[
              { id: "reply", label: "AI Reply", icon: "wand" },
              { id: "keyboard", label: "Keyboard", icon: "keyboard" },
              { id: "topics", label: "Long Chat", icon: "compass" },
              { id: "vault", label: "Vault", icon: "book" },
              { id: "tips", label: "Pro Tips", icon: "sparkles" }
            ].map((tab) => {
              const active = activeTab === tab.id;
              return (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`flex flex-col items-center gap-1 py-1 px-2.5 rounded-xl transition ${
                    active ? "text-rose-400 bg-rose-500/10" : "text-slate-400 hover:text-slate-200"
                  }`}
                >
                  <Icon name={tab.icon} className="w-5 h-5" />
                  <span className="text-[10px] font-semibold">{tab.label}</span>
                </button>
              );
            })}
          </nav>

          {/* API Key Setup Modal */}
          {showDeployModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-bold text-white flex items-center gap-2">
                    <Icon name="key" className="w-4 h-4 text-emerald-400" />
                    Gemini API Key Setup
                  </h3>
                  <button
                    onClick={() => setShowDeployModal(false)}
                    className="p-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white"
                  >
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <div className="bg-slate-950 border border-slate-800 rounded-xl p-3.5 space-y-2.5">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-emerald-400">
                      Paste Your Free Gemini API Key
                    </span>
                    <a
                      href="https://aistudio.google.com/apikey"
                      target="_blank"
                      rel="noreferrer"
                      className="text-[11px] underline text-rose-300 hover:text-rose-200"
                    >
                      Get Free Key ↗
                    </a>
                  </div>
                  <p className="text-[11px] text-slate-400 leading-relaxed">
                    Saved privately inside your phone's local browser storage (never shared anywhere):
                  </p>
                  <div className="flex gap-1.5">
                    <input
                      type="password"
                      value={customApiKey}
                      onChange={(e) => setCustomApiKey(e.target.value)}
                      placeholder="Paste AQ... or AIzaSy... key here"
                      className="flex-1 bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-lg px-2.5 py-2 text-xs text-white placeholder-slate-500 focus:outline-none"
                    />
                    {customApiKey && (
                      <button
                        onClick={() => setCustomApiKey("")}
                        className="px-2.5 py-1.5 rounded-lg bg-slate-800 text-rose-300 text-xs font-medium"
                      >
                        Clear
                      </button>
                    )}
                  </div>
                </div>

                <button
                  onClick={() => {
                    setShowDeployModal(false);
                    if (customApiKey) triggerToast("API Key saved on your device!");
                  }}
                  className="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition"
                >
                  Save & Start Chatting
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
